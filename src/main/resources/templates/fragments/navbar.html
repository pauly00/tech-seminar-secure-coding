<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">시큐어코딩</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/bbs}">1:1 문의</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        취약점 데모
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/demo}">데모 목록</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/demo/sql-injection}">SQL Injection</a></li>
                        <li><a class="dropdown-item" th:href="@{/demo/xss}">XSS</a></li>
                        <li><a class="dropdown-item" th:href="@{/demo/file-upload}">파일 업로드</a></li>
                        <li><a class="dropdown-item" th:href="@{/demo/path-traversal}">경로 순회</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${loginUser == null}">
                    <a class="nav-link" th:href="@{/login}">로그인</a>
                </li>
                <li class="nav-item" th:if="${loginUser == null}">
                    <a class="nav-link" th:href="@{/signup}">회원가입</a>
                </li>
                <li class="nav-item dropdown" th:if="${loginUser != null}">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <span th:text="${loginUser}">user</span>
                        <span th:if="${loginRole == 'admin'}" class="badge bg-secondary ms-1">admin</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">로그아웃</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
