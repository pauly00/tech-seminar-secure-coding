<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar">
    <div class="nav-bar">
        <a class="nav-brand" th:href="@{/}">시큐어 코딩</a>
        <div style="display:flex; align-items:center; gap:.75rem;">
            <span th:if="${session.loginUser}" class="text-muted small">
                <span th:text="${session.loginUser}"></span> 로그인 중
            </span>
            <a th:if="${session.loginUser}" th:href="@{/logout}" class="btn btn-outline" style="font-size:.8rem; padding:.25rem .75rem;">로그아웃</a>
            <a th:unless="${session.loginUser}" th:href="@{/login}" class="btn btn-outline" style="font-size:.8rem; padding:.25rem .75rem;">로그인</a>
        </div>
    </div>
</nav>
</body>
</html>
