<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('홈')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <!-- 히어로 -->
    <div class="p-5 mb-4 bg-dark text-white rounded-3">
        <h1 class="display-5 fw-bold">FISA 웹 취약점 분석</h1>
        <p class="fs-5 mb-4">웹 서비스 보안 취약점 시연 환경</p>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/bbs}" class="btn btn-light btn-lg">1:1 문의하기</a>
            <a th:href="@{/demo}" class="btn btn-outline-light btn-lg">취약점 데모</a>
        </div>
    </div>

    <!-- 취약점 데모 카드 -->
    <h5 class="section-heading mb-3">취약점 데모</h5>
    <div class="row g-3 mb-5">
        <div class="col-md-3 col-6">
            <a th:href="@{/demo/sql-injection}" class="vuln-card vuln-card--sql">
                <div class="vuln-icon">SQL</div>
                <h6 class="fw-bold mb-1">SQL Injection</h6>
                <small class="text-muted">검색 / 로그인 우회</small>
            </a>
        </div>
        <div class="col-md-3 col-6">
            <a th:href="@{/demo/xss}" class="vuln-card vuln-card--xss">
                <div class="vuln-icon">XSS</div>
                <h6 class="fw-bold mb-1">XSS</h6>
                <small class="text-muted">스크립트 삽입</small>
            </a>
        </div>
        <div class="col-md-3 col-6">
            <a th:href="@{/demo/file-upload}" class="vuln-card vuln-card--upload">
                <div class="vuln-icon">FILE</div>
                <h6 class="fw-bold mb-1">파일 업로드</h6>
                <small class="text-muted">웹쉘 업로드</small>
            </a>
        </div>
        <div class="col-md-3 col-6">
            <a th:href="@{/demo/path-traversal}" class="vuln-card vuln-card--path">
                <div class="vuln-icon">PATH</div>
                <h6 class="fw-bold mb-1">경로 순회</h6>
                <small class="text-muted">../ 탈출</small>
            </a>
        </div>
    </div>

    <!-- 1:1 문의 안내 -->
    <div class="alert alert-secondary mb-3">
        <strong>1:1 문의란?</strong>
        SQL Injection · XSS 취약점을 직접 실습할 수 있는 시큐어코딩 실습 게시판입니다.
        로그인 후 글을 작성할 수 있으며, 비밀글 설정도 가능합니다.
    </div>

    <!-- 최근 1:1 문의 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="section-heading mb-0">최근 1:1 문의</h5>
        <a th:href="@{/bbs}" class="btn btn-sm btn-outline-dark">전체 보기</a>
    </div>
    <div th:if="${recentBbs == null or #lists.isEmpty(recentBbs)}" class="text-muted">
        게시글이 없습니다.
    </div>
    <div th:each="bbs,iter : ${recentBbs}" th:if="${iter.index < 5}">
        <a th:href="@{/bbs/{id}(id=${bbs.bbsId})}" class="bbs-list-item">
            <div class="bbs-title">
                <span th:if="${bbs.private}" class="bbs-private-badge">비밀글</span>
                <span th:text="${bbs.bbsTitle}">제목</span>
            </div>
            <div class="bbs-meta">
                <span th:text="${bbs.bbsUserId}">작성자</span> ·
                <span th:text="${#temporals.format(bbs.bbsDate, 'yyyy-MM-dd')}">날짜</span>
            </div>
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
