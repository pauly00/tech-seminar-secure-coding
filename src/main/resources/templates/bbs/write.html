<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('글쓰기')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h4 class="fw-bold mb-4">글쓰기</h4>

            <div class="attack-hint mb-3">
                <strong>시연 포인트</strong><br>
                <small>
                    Stored XSS: 내용에 <code>&lt;script&gt;alert('XSS')&lt;/script&gt;</code> 입력 후 조회<br>
                    파일 업로드(기본): 확장자 검사 없음 — <code>webshell.jsp</code> 업로드 가능<br>
                    파일 업로드(안전): 허용 확장자(jpg, png, pdf 등)만 업로드 가능
                </small>
            </div>

            <div class="card border">
                <div class="card-body">
                    <form th:action="@{/bbs/write}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목</label>
                            <input type="text" class="form-control" name="bbsTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">내용</label>
                            <textarea class="form-control" name="bbsContent" rows="8"
                                      placeholder="내용 입력 (Stored XSS 테스트: &lt;script&gt;alert('XSS')&lt;/script&gt;)"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">파일 첨부</label>
                            <input type="file" class="form-control" name="file">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="secureUpload"
                                   name="secureUpload" value="true">
                            <label class="form-check-label" for="secureUpload">
                                안전한 파일 업로드 (화이트리스트 확장자 검사)
                            </label>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="isPrivate"
                                   name="isPrivate" value="true">
                            <label class="form-check-label" for="isPrivate">비밀글</label>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark">저장</button>
                            <a th:href="@{/bbs}" class="btn btn-outline-secondary">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
