<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('로그인')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h4 class="fw-bold mb-4">로그인</h4>

            <div class="attack-hint mb-3">
                <strong>시연 포인트</strong><br>
                <small>
                    기본(체크 해제): SQL Injection 가능 + 인증정보를 쿠키에 저장 (HttpOnly 미설정)<br>
                    안전 모드(체크): PreparedStatement + 세션 저장<br>
                    공격 예시 — ID: <code>admin' --</code> / PW: 아무거나
                </small>
            </div>

            <div th:if="${error}" class="alert alert-secondary" th:text="${error}"></div>

            <div class="card border">
                <div class="card-body">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">아이디</label>
                            <input type="text" class="form-control" name="userId"
                                   th:value="${userId}" placeholder="예: admin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">비밀번호</label>
                            <input type="password" class="form-control" name="userPassword"
                                   placeholder="예: 1234">
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="secureMode"
                                   name="secure" value="true">
                            <label class="form-check-label" for="secureMode">
                                안전한 로그인 (PreparedStatement + 세션 저장)
                            </label>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark">로그인</button>
                            <a th:href="@{/signup}" class="btn btn-outline-secondary">회원가입</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-3 p-3 bg-light rounded border">
                <small class="text-muted">
                    <strong>테스트 계정</strong><br>
                    일반: alice / 1234 &nbsp;·&nbsp; bob / 1234<br>
                    관리자: admin / 1234
                </small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
