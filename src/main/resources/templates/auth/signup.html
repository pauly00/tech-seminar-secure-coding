<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('회원가입')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h4 class="fw-bold mb-4">회원가입</h4>
            <div th:if="${error}" class="alert alert-secondary" th:text="${error}"></div>
            <div class="card border">
                <div class="card-body">
                    <form th:action="@{/signup}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">아이디</label>
                            <input type="text" class="form-control" name="userId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">비밀번호</label>
                            <input type="password" class="form-control" name="userPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">이름</label>
                            <input type="text" class="form-control" name="userName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">성별</label>
                            <select class="form-select" name="userGender">
                                <option value="남자">남자</option>
                                <option value="여자">여자</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">이메일</label>
                            <input type="email" class="form-control" name="userEmail" required>
                        </div>
                        <button type="submit" class="btn btn-dark">가입하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
