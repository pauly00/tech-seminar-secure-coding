# ===== Server =====
server.port=8080

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/techseminar?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-run schema.sql then data.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# ===== Thymeleaf =====
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Upload directory (absolute or relative)
app.upload.dir=./uploads

# Base dir for path traversal demo
app.safe-files.dir=./safe-files

# ===== Logging =====
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.techseminar=DEBUG
