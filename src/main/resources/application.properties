# ===== 서버 =====
server.port=8080

# ===== 데이터베이스 (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/techseminar?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 시작 시 schema.sql → data.sql 순서로 자동 실행
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# ===== Thymeleaf =====
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===== 파일 업로드 =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# 업로드 디렉토리 (절대경로 또는 상대경로)
app.upload.dir=./uploads

# 경로 순회 데모용 기준 디렉토리
app.safe-files.dir=./safe-files

# ===== 로깅 =====
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.techseminar=DEBUG
